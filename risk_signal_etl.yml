# Place this file at .github/workflows/risk_signal_etl.yml in your repo.
# Runs the Risk Signal ETL daily and on demand. Add the secrets under
# Settings > Secrets and variables > Actions in the GitHub repo.

name: Risk Signal ETL

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily — adjust to taste
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run ETL
        run: python etl_risk_signal.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
